[theme]
primaryColor = "#EE5324"          # Vibrant Sellomize Sunset Orange
backgroundColor = "#061512"       # Deep Obsidian Emerald for dark canvas
secondaryBackgroundColor = "#0B2621" # Rich Pine Glass for secondary containers
textColor = "#F8FAFC"             # Crisp modern slate white
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
