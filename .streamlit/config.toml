[theme]
primaryColor = "#FD4D1B"          # 10% Sellomize Flame Orange from sellomize.com
backgroundColor = "#FFFFFF"       # 60% Crisp White Canvas from sellomize.com
secondaryBackgroundColor = "#F0F5F4" # Soft Pine-tinted White for cards/sidebars
textColor = "#083731"             # 30% Sellomize Signature Deep Pine Green
font = "sans serif"

[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false

[client]
showErrorDetails = "full"

